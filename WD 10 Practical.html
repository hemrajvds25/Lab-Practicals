<!DOCTYPE html>
<html>
<head>
    <title>Frames Example</title>
</head>

<body>


<iframe src="https://www.wikipedia.org" 
        width="100%" height="150" 
        style="border:1px solid black;">
</iframe>

<br>


<div style="display:flex;">

    <!-- Left Frame (Navigation) -->
    <iframe src="https://www.example.com" 
            width="30%" height="500" 
            style="border:1px solid black;">
    </iframe>

    <!-- Right Frame (Google Map) -->
    <iframe 
        src="https://www.google.com/maps?q=Nagpur&output=embed"
        width="70%" height="500" 
        style="border:1px solid black;">
    </iframe>

</div>

</body>
</html>
