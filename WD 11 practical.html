<!DOCTYPE html>
<html>
<head>
    <title>HTML5 APIs Simple Demo</title>
</head>
<body>
<h1>HTML5 API </h1>

<!-- 1. Drag and Drop -->
<h2>1. Drag and Drop</h2>

<div id="box" draggable="true" 
     ondragstart="drag(event)" 
     style="width:100px;height:100px;background:blue;color:white;text-align:center;">
    Drag
</div>
<br>
<div id="area" 
     ondragover="allowDrop(event)" 
     ondrop="drop(event)" 
     style="width:150px;height:150px;border:2px solid black;">
    Drop here
</div>
<h2>2. Geolocation</h2>
<button onclick="getLocation()">Get Location</button>
<p id="location"></p>

<h2>3. Web Storage</h2>

<input type="text" id="name" placeholder="Enter name">
<br><br>

<button onclick="save()">Save</button>
<button onclick="show()">Show</button>

<p id="result"></p>
<script>

    function allowDrop(ev) {
        ev.preventDefault();
    }

    function drag(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
    }

    function drop(ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        ev.target.appendChild(document.getElementById(data));
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition);
        } else {
            document.getElementById("location").innerHTML = "Not supported";
        }
    }

    function showPosition(position) {
        document.getElementById("location").innerHTML =
            "Latitude: " + position.coords.latitude +
            "<br>Longitude: " + position.coords.longitude;
    }

    function save() {
        var name = document.getElementById("name").value;
        localStorage.setItem("username", name);
        alert("Saved!");
    }

    function show() {
        var name = localStorage.getItem("username");
        document.getElementById("result").innerHTML = "Name: " + name;
    }

</script>

</body>
</html>
