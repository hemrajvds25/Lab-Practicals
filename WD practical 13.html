<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Website</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MySite</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Menu</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Option 1</a></li>
            <li><a class="dropdown-item" href="#">Option 2</a></li>
          </ul>
        </li>

      </ul>
    </div>
  </div>
</nav>

<div class="container mt-3">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#">Home</a></li>
      <li class="breadcrumb-item active">Page</li>
    </ol>
  </nav>
</div>

<div class="container mt-3">
  <div class="row">

    <div class="col-md-6 col-12">
      <div class="p-3 bg-light border">Column 1 (Responsive)</div>
    </div>

    <div class="col-md-6 col-12">
      <div class="p-3 bg-light border">Column 2 (Responsive)</div>
    </div>

  </div>
</div>

<div class="container mt-4">
  <h3>Contact Form</h3>

  <form>
    <div class="mb-3">
      <label>Name</label>
      <input type="text" class="form-control" placeholder="Enter name">
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label>Message</label>
      <textarea class="form-control"></textarea>
    </div>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
      Submit
    </button>
  </form>
</div>

<div class="modal fade" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Form Submitted</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Your form has been submitted successfully!
      </div>

      <div class="modal-footer">
        <button class="btn btn-success" data-bs-dismiss="modal">OK</button>
      </div>

    </div>
  </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-4">
  <p>© 2026 Mini Website</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
